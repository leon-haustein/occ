# Beispiel-Snippets für OVGUCards (nginx, innerhalb eines server { }-Blocks).
#
#   root /var/www/ovgucards/frontend;
#   include /path/to/OVGUCards/scripts/nginx-ovgucards.conf;
#
# Für .mjs-MIME: scripts/fix-nginx-mjs-mime.py ausführen.

# studiengaenge.html als Startseite für /
index studiengaenge.html index.html;

location / {
    try_files $uri $uri/ =404;
}

# API an Node-Backend weiterleiten (Port anpassen)
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
